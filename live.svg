<svg xmlns="http://www.w3.org/2000/svg" width="880" height="120" viewBox="0 0 880 120">
  <rect width="880" height="120" fill="#060907"/>
  <rect x="10" y="10" width="860" height="100" rx="5" fill="#0b110c" stroke="#2c3f30"/>
  <rect x="16" y="16" width="848" height="5" fill="#62c878" opacity="0.12">
    <animate attributeName="y" values="16;98;16" dur="3s" repeatCount="indefinite"/>
  </rect>

  <circle cx="48" cy="60" r="6" fill="#62c878">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="48" cy="60" r="12" fill="none" stroke="#62c878" stroke-width="1">
    <animate attributeName="r" values="8;18;8" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;0;0.45" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <text x="78" y="66" font-family="Consolas, ui-monospace, monospace" font-size="18" fill="#d7ead9">building</text>
  <text x="200" y="66" font-family="Consolas, ui-monospace, monospace" font-size="18" fill="#62c878">
    <animate attributeName="opacity" values="0.15;1;1;0.15" dur="1.2s" repeatCount="indefinite"/>...
  </text>

  <rect x="560" y="52" width="280" height="10" rx="5" fill="#1a2a1c"/>
  <rect x="560" y="52" width="70" height="10" rx="5" fill="#62c878">
    <animate attributeName="width" values="40;260;90;200;40" dur="2.8s" repeatCount="indefinite"/>
  </rect>
</svg>
