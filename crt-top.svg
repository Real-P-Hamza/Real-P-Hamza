<svg xmlns="http://www.w3.org/2000/svg" width="768" height="116" viewBox="0 0 768 116" role="img" aria-label="P-HAMZA CRT Terminal Header">
  <defs>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.30"/>
    </pattern>
    <radialGradient id="crtBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b1a0e"/>
      <stop offset="100%" stop-color="#030804"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#39ff6a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39ff6a" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#39ff6a" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="screenClip">
      <rect x="6" y="6" width="756" height="104" rx="5"/>
    </clipPath>
  </defs>

  <!-- Outer Bezel -->
  <rect width="768" height="116" rx="7" fill="#020503"/>
  <rect x="6" y="6" width="756" height="104" rx="5" fill="url(#crtBg)" stroke="#1d4426" stroke-width="1.2"/>

  <!-- Corner HUD Reticles -->
  <g stroke="#39ff6a" stroke-width="1.6" fill="none" opacity="0.75">
    <path d="M 6 18 L 6 6 L 18 6"/>
    <path d="M 750 6 L 762 6 L 762 18"/>
    <path d="M 6 98 L 6 110 L 18 110"/>
    <path d="M 750 110 L 762 110 L 762 98"/>
  </g>

  <g clip-path="url(#screenClip)">
    <!-- Top Telemetry Strip -->
    <text x="24" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#529463" letter-spacing="1">TERM://REAL-P-HAMZA  ·  CH-01 // P1-CRT</text>

    <!-- Signal Equalizer Bars -->
    <g fill="#2ee85c" opacity="0.7">
      <rect x="646" y="16" width="3" height="10"><animate attributeName="height" values="4;10;6;9;4" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="22;16;20;17;22" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="652" y="15" width="3" height="11"><animate attributeName="height" values="10;5;11;6;10" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="16;21;15;20;16" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="658" y="18" width="3" height="8"><animate attributeName="height" values="6;11;4;10;6" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="20;15;22;16;20" dur="1.5s" repeatCount="indefinite"/></rect>
      <rect x="664" y="17" width="3" height="9"><animate attributeName="height" values="9;4;8;11;9" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="17;22;18;15;17" dur="1.2s" repeatCount="indefinite"/></rect>
    </g>

    <!-- Online Indicator -->
    <circle cx="684" cy="21" r="3.8" fill="#39ff6a" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="694" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#39ff6a" letter-spacing="1">ONLINE</text>

    <!-- Divider + Travelling Pulse -->
    <line x1="20" y1="35" x2="748" y2="35" stroke="#17381f" stroke-width="1"/>
    <rect x="20" y="34.5" width="76" height="1.6" fill="#39ff6a" opacity="0.85">
      <animate attributeName="x" values="20;672;20" dur="5.2s" repeatCount="indefinite"/>
    </rect>

    <!-- Main Handle + Subtle Glitch Layer -->
    <text x="26" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="40" font-weight="700" fill="#39ff6a" opacity="0">P-HAMZA
      <animate attributeName="opacity" values="0;0;0.38;0;0;0;0.25;0" dur="5.6s" repeatCount="indefinite"/>
      <animate attributeName="x" values="24;30;22;24" dur="5.6s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="40" font-weight="700" fill="#e2ffea" filter="url(#glow)" letter-spacing="1">P-HAMZA</text>

    <!-- Blinking Block Cursor -->
    <rect x="208" y="54" width="12" height="32" fill="#39ff6a" filter="url(#glow)">
      <animate attributeName="opacity" values="1;1;0.08;0.08;1" dur="0.95s" repeatCount="indefinite"/>
    </rect>

    <!-- Vertical Split -->
    <line x1="254" y1="48" x2="254" y2="96" stroke="#1b4024" stroke-width="1.2"/>

    <!-- Rotating Motto & Tagline -->
    <text x="274" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.5" font-weight="600" fill="#9cf5b2">
      &gt; "Uzun yol varsa yanlış yoldur."
    </text>
    <text x="274" y="91" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#5ca870">
      C# / .NET  ·  Otomasyon &amp; Bot  ·  Masaüstü Araçlar  ·  Oyun
    </text>

    <!-- Moving CRT Refresh Beam -->
    <rect x="6" y="-24" width="756" height="24" fill="url(#beam)">
      <animate attributeName="y" values="-24;116" dur="4.2s" repeatCount="indefinite"/>
    </rect>

    <!-- CRT Scanline Texture Overlay -->
    <rect x="6" y="6" width="756" height="104" fill="url(#scanlines)"/>
  </g>
</svg>
