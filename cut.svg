<svg xmlns="http://www.w3.org/2000/svg" width="880" height="168" viewBox="0 0 880 168">
  <rect width="880" height="168" fill="#060907"/>
  <rect x="10" y="10" width="860" height="148" rx="5" fill="#0b110c" stroke="#2c3f30"/>

  <rect x="20" y="18" width="840" height="4" fill="#3d6a48" opacity="0.16">
    <animate attributeName="y" values="18;146;18" dur="3.8s" repeatCount="indefinite"/>
  </rect>

  <g font-family="Consolas, ui-monospace, monospace" font-size="15" fill="#d7ead9">
    <g>
      <rect x="28" y="36" width="400" height="50" rx="4" fill="#101812"/>
      <rect x="28" y="36" width="6" height="50" fill="#62c878">
        <animate attributeName="opacity" values="1;0.2;0.2;0.2;1" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="48" y="67">tikla  →  yaz</text>
    </g>
    <g>
      <rect x="452" y="36" width="400" height="50" rx="4" fill="#101812"/>
      <rect x="452" y="36" width="6" height="50" fill="#62c878">
        <animate attributeName="opacity" values="0.2;1;0.2;0.2;0.2" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="472" y="67">kurulum  →  exe</text>
    </g>
    <g>
      <rect x="28" y="98" width="400" height="50" rx="4" fill="#101812"/>
      <rect x="28" y="98" width="6" height="50" fill="#62c878">
        <animate attributeName="opacity" values="0.2;0.2;1;0.2;0.2" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="48" y="129">ayar  →  arac</text>
    </g>
    <g>
      <rect x="452" y="98" width="400" height="50" rx="4" fill="#101812"/>
      <rect x="452" y="98" width="6" height="50" fill="#62c878">
        <animate attributeName="opacity" values="0.2;0.2;0.2;1;0.2" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="472" y="129">rutin  →  kod</text>
    </g>
  </g>
