    <rect x="52" y="168" width="8" height="12"><animate attributeName="height" values="12;22;12" dur="1.5s" repeatCount="indefinite"/></rect>
    <rect x="64" y="168" width="8" height="12"><animate attributeName="height" values="6;16;6" dur="0.9s" repeatCount="indefinite"/></rect>
    <rect x="76" y="168" width="8" height="12"><animate attributeName="height" values="10;20;10" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="88" y="168" width="8" height="12"><animate attributeName="height" values="7;19;7" dur="1.1s" repeatCount="indefinite"/></rect>
  </g>

  <circle cx="800" cy="36" r="5" fill="#62c878">
    <animate attributeName="r" values="4;6;4" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.95;0.3;0.95" dur="1.6s" repeatCount="indefinite"/>
