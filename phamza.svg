<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200">
  <rect width="880" height="200" fill="#060907"/>
  <rect x="10" y="10" width="860" height="180" rx="5" fill="#0b110c" stroke="#2c3f30"/>

  <rect x="16" y="16" width="848" height="7" fill="#3d6a48" opacity="0.14">
    <animate attributeName="y" values="16;176;16" dur="5.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="16" y="40" width="848" height="3" fill="#62c878" opacity="0.10">
    <animate attributeName="y" values="40;170;40" dur="3.4s" repeatCount="indefinite"/>
  </rect>

  <g fill="#3d6a48" opacity="0.22">
