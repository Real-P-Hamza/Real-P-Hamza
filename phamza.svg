    <animate attributeName="opacity" values="0.4;0;0.4" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <text x="28" y="102" font-family="Consolas, ui-monospace, monospace" font-size="52" font-weight="700" fill="#d7ead9">P-HAMZA</text>
  <text x="30" y="102" font-family="Consolas, ui-monospace, monospace" font-size="52" font-weight="700" fill="#62c878" opacity="0">P-HAMZA
    <animate attributeName="opacity" values="0;0;0.35;0;0;0.25;0" dur="4.8s" repeatCount="indefinite"/>
    <animate attributeName="x" values="28;34;26;28" dur="4.8s" repeatCount="indefinite"/>
  </text>
  <rect x="292" y="74" width="11" height="32" fill="#62c878">
    <animate attributeName="opacity" values="1;0.1;1" dur="0.85s" repeatCount="indefinite"/>
  </rect>

  <text x="28" y="146" font-family="Consolas, ui-monospace, monospace" font-size="15" fill="#8fbf96">
    C#  ·  kes  ·  oyna
