<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="kesilen isler">
  <rect width="880" height="250" fill="#050805"/>
  <rect x="10" y="10" width="860" height="230" rx="4" fill="#0a100b" stroke="#2a3d2c"/>
  <text x="28" y="40" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#6d8a70">// ayni seyi 2 kere tiklamiyorum</text>

  <g font-family="Consolas, ui-monospace, monospace" font-size="16">
    <g>
      <rect x="28" y="58" width="824" height="36" rx="3" fill="#122016"/>
      <rect x="28" y="58" width="6" height="36" fill="#39ff6a">
        <animate attributeName="opacity" values="1;0.25;0.25;0.25;1" dur="5s" repeatCount="indefinite"/>
      </rect>
      <text x="48" y="82" fill="#e7ffe9">tekrar tiklama</text>
      <text x="820" y="82" text-anchor="end" fill="#c8ff4d">yaz, unut, kullan</text>
    </g>
    <g>
      <rect x="28" y="102" width="824" height="36" rx="3" fill="#122016"/>
      <rect x="28" y="102" width="6" height="36" fill="#39ff6a">
        <animate attributeName="opacity" values="0.25;1;0.25;0.25;0.25" dur="5s" repeatCount="indefinite"/>
      </rect>
      <text x="48" y="126" fill="#e7ffe9">12 adimlik kurulum</text>
      <text x="820" y="126" text-anchor="end" fill="#c8ff4d">1 exe. gitti.</text>
    </g>
    <g>
      <rect x="28" y="146" width="824" height="36" rx="3" fill="#122016"/>
      <rect x="28" y="146" width="6" height="36" fill="#39ff6a">
        <animate attributeName="opacity" values="0.25;0.25;1;0.25;0.25" dur="5s" repeatCount="indefinite"/>
      </rect>
      <text x="48" y="170" fill="#e7ffe9">"neredeydi o ayar"</text>
      <text x="820" y="170" text-anchor="end" fill="#c8ff4d">kucuk windows araci</text>
    </g>
    <g>
      <rect x="28" y="190" width="824" height="36" rx="3" fill="#122016"/>
      <rect x="28" y="190" width="6" height="36" fill="#39ff6a">
        <animate attributeName="opacity" values="0.25;0.25;0.25;1;0.25" dur="5s" repeatCount="indefinite"/>
      </rect>
      <text x="48" y="214" fill="#e7ffe9">oyun / sunucu isi</text>
      <text x="820" y="214" text-anchor="end" fill="#c8ff4d">elle yapmam, sinir bozar</text>
    </g>
  </g>
</svg>
