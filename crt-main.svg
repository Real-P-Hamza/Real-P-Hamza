<svg xmlns="http://www.w3.org/2000/svg" width="490" height="360" viewBox="0 0 490 360" role="img" aria-label="P-Hamza Operator Dossier">
  <defs>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.30"/>
    </pattern>
    <radialGradient id="crtBg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0b1a0e"/>
      <stop offset="100%" stop-color="#030804"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#39ff6a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39ff6a" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#39ff6a" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="panelClip">
      <rect x="6" y="6" width="478" height="348" rx="5"/>
    </clipPath>
  </defs>

  <!-- Outer Frame -->
  <rect width="490" height="360" rx="7" fill="#020503"/>
  <rect x="6" y="6" width="478" height="348" rx="5" fill="url(#crtBg)" stroke="#1d4426" stroke-width="1.2"/>

  <!-- Corner HUD Reticles -->
  <g stroke="#39ff6a" stroke-width="1.6" fill="none" opacity="0.75">
    <path d="M 6 18 L 6 6 L 18 6"/>
    <path d="M 472 6 L 484 6 L 484 18"/>
    <path d="M 6 342 L 6 354 L 18 354"/>
    <path d="M 472 354 L 484 354 L 484 342"/>
  </g>

  <g clip-path="url(#panelClip)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <!-- Top Window Bar -->
    <text x="22" y="27" font-size="11" fill="#529463" letter-spacing="0.8">$ cat /etc/operator/whoami.conf</text>
    <text x="468" y="27" text-anchor="end" font-size="10.5" fill="#3d734b">DOSSIER // v2.0</text>
    <line x1="18" y1="36" x2="472" y2="36" stroke="#17381f" stroke-width="1"/>

    <!-- Identity Summary Block -->
    <rect x="20" y="47" width="450" height="80" rx="4" fill="#071209" stroke="#1a3d22" stroke-width="1"/>
    <text x="34" y="69" font-size="12" fill="#4f8f60">HANDLE</text>
    <text x="98" y="69" font-size="12" fill="#4f8f60">:</text>
    <text x="114" y="69" font-size="13" font-weight="700" fill="#e2ffea">@Real-P-Hamza</text>
    <rect x="236" y="56" width="96" height="17" rx="3" fill="#0f2915" stroke="#2c7a40" stroke-width="0.9"/>
    <text x="284" y="68" text-anchor="middle" font-size="10" font-weight="700" fill="#39ff6a">NO-CV MODE</text>

    <text x="34" y="91" font-size="12" fill="#4f8f60">ODAK</text>
    <text x="98" y="91" font-size="12" fill="#4f8f60">:</text>
    <text x="114" y="91" font-size="12.5" fill="#9cf5b2">Kestirme araçlar, botlar, otomasyon</text>

    <text x="34" y="113" font-size="12" fill="#4f8f60">FELSEFE</text>
    <text x="98" y="113" font-size="12" fill="#4f8f60">:</text>
    <text x="114" y="113" font-size="12" fill="#70b882">Takma ad yeter; aynı işi iki kez elle yapmam.</text>

    <!-- Section Label -->
    <text x="22" y="147" font-size="10.5" font-weight="700" fill="#4e8f5e" letter-spacing="1.2">// ÇALIŞMA PRENSİBİ</text>
    <line x1="176" y1="143" x2="470" y2="143" stroke="#15331c" stroke-width="1"/>

    <!-- 2x2 Workflow Cards -->
    <!-- Card 1 -->
    <g>
      <rect x="20" y="157" width="219" height="72" rx="4" fill="#08140a" stroke="#235730" stroke-width="1.1">
        <animate attributeName="stroke" values="#39ff6a;#1b4225;#1b4225;#1b4225;#39ff6a" dur="4.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="20" y="157" width="4" height="72" rx="2" fill="#39ff6a">
        <animate attributeName="opacity" values="1;0.25;0.25;0.25;1" dur="4.8s" repeatCount="indefinite"/>
      </rect>
      <text x="35" y="180" font-size="10.5" fill="#4d8c5d">01 // OTOMASYON</text>
      <text x="35" y="198" font-size="13" font-weight="700" fill="#e2ffea">Tıkla  →  Kodla</text>
      <text x="35" y="216" font-size="11" fill="#6cb37e">Aynı tuşa 12 kere basmam.</text>
    </g>

    <!-- Card 2 -->
    <g>
      <rect x="251" y="157" width="219" height="72" rx="4" fill="#08140a" stroke="#235730" stroke-width="1.1">
        <animate attributeName="stroke" values="#1b4225;#39ff6a;#1b4225;#1b4225;#1b4225" dur="4.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="251" y="157" width="4" height="72" rx="2" fill="#39ff6a">
        <animate attributeName="opacity" values="0.25;1;0.25;0.25;0.25" dur="4.8s" repeatCount="indefinite"/>
      </rect>
      <text x="266" y="180" font-size="10.5" fill="#4d8c5d">02 // PAKETLEME</text>
      <text x="266" y="198" font-size="13" font-weight="700" fill="#e2ffea">Kurulum  →  Tek Dosya</text>
      <text x="266" y="216" font-size="11" fill="#6cb37e">12 adımlık kılavuz istemem.</text>
    </g>

    <!-- Card 3 -->
    <g>
      <rect x="20" y="239" width="219" height="72" rx="4" fill="#08140a" stroke="#235730" stroke-width="1.1">
        <animate attributeName="stroke" values="#1b4225;#1b4225;#39ff6a;#1b4225;#1b4225" dur="4.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="20" y="239" width="4" height="72" rx="2" fill="#39ff6a">
        <animate attributeName="opacity" values="0.25;0.25;1;0.25;0.25" dur="4.8s" repeatCount="indefinite"/>
      </rect>
      <text x="35" y="262" font-size="10.5" fill="#4d8c5d">03 // PRATİKLİK</text>
      <text x="35" y="280" font-size="13" font-weight="700" fill="#e2ffea">Karmaşa  →  Araç</text>
      <text x="35" y="298" font-size="11" fill="#6cb37e">Menü aramam, araç yazarım.</text>
    </g>

    <!-- Card 4 -->
    <g>
      <rect x="251" y="239" width="219" height="72" rx="4" fill="#08140a" stroke="#235730" stroke-width="1.1">
        <animate attributeName="stroke" values="#1b4225;#1b4225;#1b4225;#39ff6a;#1b4225" dur="4.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="251" y="239" width="4" height="72" rx="2" fill="#39ff6a">
        <animate attributeName="opacity" values="0.25;0.25;0.25;1;0.25" dur="4.8s" repeatCount="indefinite"/>
      </rect>
      <text x="266" y="262" font-size="10.5" fill="#4d8c5d">04 // VERİM</text>
      <text x="266" y="280" font-size="13" font-weight="700" fill="#e2ffea">Rutin  →  Bot &amp; Kod</text>
      <text x="266" y="298" font-size="11" fill="#6cb37e">Angarya işi koda yıkarım.</text>
    </g>

    <!-- Bottom Terminal Prompt -->
    <line x1="18" y1="323" x2="472" y2="323" stroke="#17381f" stroke-width="1"/>
    <text x="22" y="341" font-size="11.5" font-weight="700" fill="#39ff6a">p-hamza@crt:~$</text>
    <text x="128" y="341" font-size="11.5" fill="#9cf5b2">işi kes, derle, gerisini oyna</text>
    <rect x="340" y="330" width="7" height="13" fill="#39ff6a" filter="url(#glow)">
      <animate attributeName="opacity" values="1;1;0.1;0.1;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>

    <!-- Moving CRT Refresh Beam -->
    <rect x="6" y="-40" width="478" height="40" fill="url(#beam)">
      <animate attributeName="y" values="-40;360" dur="5.4s" repeatCount="indefinite"/>
    </rect>

    <!-- Scanline Texture -->
    <rect x="6" y="6" width="478" height="348" fill="url(#scanlines)"/>
  </g>
</svg>
