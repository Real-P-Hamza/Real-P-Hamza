  </text>

  <text x="28" y="96" font-family="Consolas, ui-monospace, monospace" font-size="14" fill="#8fbf96">next   duzgun bir tool repo</text>
  <text x="28" y="122" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#6b8570">yildiz basmak zorunda degilsin. bakip gec de olur.</text>

  <rect x="560" y="48" width="280" height="10" rx="5" fill="#1a2a1c"/>
