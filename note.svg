  <text x="28" y="52" font-family="Consolas, ui-monospace, monospace" font-size="16" fill="#d7ead9">takma ad yeter. cv yok, uzun bio yok.</text>
  <text x="28" y="84" font-family="Consolas, ui-monospace, monospace" font-size="15" fill="#8fbf96">ayni isi 2 kere tikliyorsam C# ile kestiriyorum.</text>
  <text x="28" y="112" font-family="Consolas, ui-monospace, monospace" font-size="15" fill="#8fbf96">windows, kucuk arac, oyun isi. gerisini oyna.</text>
  <text x="28" y="140" font-family="Consolas, ui-monospace, monospace" font-size="14" fill="#6b8570">isim yok. sehir yok. yuz yok. handle yeter.</text>
  <text x="28" y="168" font-family="Consolas, ui-monospace, monospace" font-size="14" fill="#6b8570">uzun yol varsa yanlis yoldur.</text>
  <rect x="28" y="186" width="9" height="16" fill="#62c878">
