  </rect>

  <text x="28" y="44" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#6b8570">$ whoami</text>
  <text x="28" y="84" font-family="Consolas, ui-monospace, monospace" font-size="28" fill="#d7ead9">p-hamza</text>
  <rect x="178" y="62" width="10" height="24" fill="#62c878">
